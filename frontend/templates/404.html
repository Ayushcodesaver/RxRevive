{% extends "base.html" %}
{% import 'macros.html' as macros %}
{% block title %}Page not found · RxRevive{% endblock %}

{% block content %}
<section class="section auth-section">
  <div class="container auth-wrap">
    <div class="glass-card auth-card center-text">
      <h1 class="auth-title">404</h1>
      <p class="muted">{{ message or "This page could not be found. It may have been moved, or the link is incorrect." }}</p>
      <div class="hero-actions center">
        <a class="btn accent" href="{{ url_for('main.index') }}">Back to Home</a>
        <a class="btn ghost-dark" href="{{ url_for('analysis.analyze_page') }}">Analyze a Resume</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
