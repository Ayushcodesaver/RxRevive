version: "3.9"

services:
  ai-backend:
    build: ./ai-backend
    ports:
      - "8000:8000"
    environment:
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - PYTHON_API_SECRET=${PYTHON_API_SECRET:-}
      - CLERK_JWT_ISSUER_DOMAIN=${CLERK_JWT_ISSUER_DOMAIN:-}
      - REDIS_URL=${REDIS_URL:-}
      - MODEL_DEVICE=${MODEL_DEVICE:-auto}
    volumes:
      - generated_reports:/srv/generated_reports
      - ./datasets:/srv/datasets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["tasks"]

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-}
      - PYTHON_API_URL=http://ai-backend:8000
      - PYTHON_API_SECRET=${PYTHON_API_SECRET:-}
    depends_on:
      ai-backend:
        condition: service_healthy

volumes:
  generated_reports:
